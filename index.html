<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청첩장 모임 일정</title>
<style>
  :root{
    --deuk:#3b6ef6;
    --bbung:#ef476f;
    --bg:#f5f6fa;
    --card:#ffffff;
    --border:#e5e7ef;
    --text:#222;
    --muted:#8a8f98;
    --done:#c9cdd6;
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Arial,sans-serif;
    background:var(--bg);
    margin:0;
    padding:0 16px 64px;
    color:var(--text);
  }

  .app-shell{
    max-width:720px;
    margin:0 auto;
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(245,246,250,.94);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:18px 0 12px;
  }

  h1{
    text-align:center;
    font-size:23px;
    margin:0 0 4px;
    letter-spacing:-.5px;
  }

  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin:0 0 10px;
  }

  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    padding:4px;
    background:#e9ebf1;
    border-radius:14px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
  }

  .tab{
    border:0;
    border-radius:11px;
    padding:11px 10px;
    font-size:16px;
    font-weight:800;
    color:#777d87;
    background:transparent;
    cursor:pointer;
    transition:all .2s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .tab.active{
    background:#fff;
    color:var(--deuk);
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }

  .tab[data-person="bbung"].active{
    color:var(--bbung);
  }

  .sync-status{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin:8px 0 0;
    min-height:16px;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:12px 0 14px;
  }

  .stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:13px;
    padding:11px 8px;
    text-align:center;
  }

  .stat-label{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:4px;
  }

  .stat-value{
    display:block;
    font-size:17px;
    font-weight:800;
    letter-spacing:-.3px;
  }

  .schedule-panel{
    animation:panelIn .2s ease;
  }

  @keyframes panelIn{
    from{opacity:.5;transform:translateY(5px);}
    to{opacity:1;transform:translateY(0);}
  }

  .person-card{
    background:var(--card);
    border-radius:16px;
    border:1px solid var(--border);
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }

  .person-header{
    padding:15px 18px;
    font-size:17px;
    font-weight:800;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .person-header .count-summary{
    font-size:11px;
    font-weight:500;
    opacity:.92;
  }

  .deuk-header{background:var(--deuk);}
  .bbung-header{background:var(--bbung);}

  .table-wrap{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
  }

  table{
    width:100%;
    min-width:1100px;
    border-collapse:collapse;
    font-size:12px;
    table-layout:auto;
  }

  th{
    text-align:left;
    padding:8px 7px;
    background:#fafbfd;
    color:var(--muted);
    font-weight:600;
    font-size:10px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }

  td{
    padding:9px 7px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }

  tbody tr:last-child td{border-bottom:none;}

  tr.done td{
    color:var(--done);
    text-decoration:line-through;
  }

  tr.done .dday-badge{
    background:#eee !important;
    color:var(--done) !important;
  }

  .date-cell{
    width:90px;
    min-width:90px;
    white-space:nowrap;
    font-weight:700;
  }

  .name-cell{
    min-width:500px;
    width:500px;
    max-width:none;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    line-height:1.45;
  }

  .check-cell{text-align:center;width:32px;min-width:32px;}
  .del-cell{text-align:center;width:28px;min-width:28px;}

  .count-input{
    width:48px;
    padding:5px 6px;
    border:1px solid var(--border);
    border-radius:7px;
    text-align:center;
    font-size:12px;
  }

  .cost-input{
    width:92px;
    padding:5px 6px;
    border:1px solid var(--border);
    border-radius:7px;
    text-align:right;
    font-size:12px;
  }

  .cost-per-person{
    min-width:95px;
    white-space:nowrap;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .cost-total{
    font-variant-numeric:tabular-nums;
  }

  .edit-date,
  .edit-name{
    width:100%;
    min-width:0;
    border:1px solid transparent;
    background:transparent;
    border-radius:5px;
    padding:4px 3px;
    font:inherit;
    color:inherit;
  }

  .date-display{
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    margin-bottom:3px;
  }

  .date-button{
    border:0;
    background:transparent;
    padding:4px 2px;
    margin:0;
    color:inherit;
    font:inherit;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
    border-radius:5px;
  }

  .date-button:hover,
  .date-button:focus{
    background:#f0f3ff;
    outline:none;
  }

  .hidden-date-picker{
    position:fixed;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
    left:-100px;
    top:-100px;
  }

  .edit-date{display:none;}

  .edit-name{
    display:block;
    width:100%;
    min-height:30px;
    font-size:12px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    line-height:1.4;
    resize:none;
    overflow:hidden;
  }

  .edit-date:focus,
  .edit-name:focus{
    outline:2px solid #3b6ef633;
    border-color:var(--border);
    background:#fff;
  }

  .dday-badge{
    display:inline-block;
    min-width:48px;
    text-align:center;
    padding:4px 7px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    background:#eef1ff;
    color:var(--deuk);
    white-space:nowrap;
  }

  .dday-badge.today{
    background:#fff1cc;
    color:#b8860b;
  }

  .dday-badge.past{
    background:#f0f0f0;
    color:var(--muted);
  }

  .del-btn{
    border:none;
    background:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    line-height:1;
    padding:3px 5px;
    border-radius:6px;
  }

  .del-btn:hover{
    color:#ef476f;
    background:#fdeaee;
  }

  .empty{
    padding:28px 20px !important;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  .add-row{
    display:grid;
    grid-template-columns:1fr 1.4fr 64px 110px auto;
    gap:6px;
    padding:12px;
    background:#fafbfd;
    border-top:1px solid var(--border);
    align-items:center;
  }

  .add-row input[type="date"],
  .add-row input[type="text"],
  .add-row input[type="number"]{
    padding:8px 8px;
    border:1px solid var(--border);
    border-radius:7px;
    font-size:12px;
    min-width:0;
  }

  .add-row input[type="number"]{
    text-align:center;
  }

  .add-btn{
    padding:8px 12px;
    border:none;
    border-radius:7px;
    background:var(--text);
    color:#fff;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }

  .add-btn.deuk-btn{background:var(--deuk);}
  .add-btn.bbung-btn{background:var(--bbung);}
  .add-btn:hover{opacity:.88;}

  .footer-note{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    margin-top:16px;
  }

  table{table-layout:fixed;min-width:0;}

  @media (max-width:600px){
    .table-wrap{
      width:100%;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    table{min-width:1100px;}

    body{padding:0 10px 48px;}

    .topbar{padding-top:14px;}

    h1{font-size:21px;}

    .stats{gap:6px;}

    .stat-card{padding:10px 5px;}

    .stat-value{font-size:16px;}

    .person-header{padding:14px 15px;}

    .add-row{
      grid-template-columns:1fr 1.25fr 58px 100px;
    }

    .add-btn{
      grid-column:1 / -1;
      width:100%;
      padding:10px;
    }

    table{font-size:12px;}
  }

  @media (max-width:380px){
    .stats{grid-template-columns:1fr 1fr 1fr;}
    .stat-label{font-size:9px;}
    .stat-value{font-size:15px;}
  }
</style>
</head>
<body>
  <input id="global-date-picker" class="hidden-date-picker" type="date"
    onchange="applyPickedDate(this.value)">

  <div class="app-shell">
    <div class="topbar">
      <h1>청첩장 모임 일정</h1>
      <div class="subtitle" id="todayLabel"></div>

      <div class="tabs">
        <button id="tab-deuk" class="tab active" data-person="deuk" onclick="switchTab('deuk')">득</button>
        <button id="tab-bbung" class="tab" data-person="bbung" onclick="switchTab('bbung')">뿡</button>
      </div>

      <div class="sync-status" id="syncStatus">연결 중...</div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-label">전체 일정</span>
        <span class="stat-value" id="stat-total">0건</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">예정 인원</span>
        <span class="stat-value" id="stat-people">0명</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">총 비용</span>
        <span class="stat-value" id="stat-cost">0원</span>
      </div>
    </div>

    <div class="schedule-panel" id="schedule-panel"></div>

    <div class="footer-note">
      모임 추가·인원 수·총 비용 수정·완료 체크 내용은 실시간으로 동기화됩니다.<br>
      모든 접속자에게 동일하게 반영되며 일정은 날짜순으로 자동 정렬됩니다.
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ---- Firebase 연동 ----
const firebaseConfig = {
  apiKey: "AIzaSyAMQMPj3pJXRfPiL2BJG1AHndP3Yd_aKMc",
  authDomain: "chungmo-schedule.firebaseapp.com",
  databaseURL: "https://chungmo-schedule-default-rtdb.firebaseio.com",
  projectId: "chungmo-schedule",
  storageBucket: "chungmo-schedule.firebasestorage.app",
  messagingSenderId: "14361057436",
  appId: "1:14361057436:web:042097dcc432750e9e7559"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const meetingsRef = db.ref("meetings");
let currentTab = localStorage.getItem("chungmo-current-tab") || "deuk";

// ---- 최초 1회 시딩용 초기 데이터 (연도는 2026년 기준) ----
const initialData = [
  // 득
  { person: "deuk", date: "2026-08-08", name: "대겸,성우,태승", count: 3 },
  { person: "deuk", date: "2026-08-11", name: "수호,원호", count: 2 },
  { person: "deuk", date: "2026-08-19", name: "민준,우태", count: 2 },
  { person: "deuk", date: "2026-08-20", name: "신서유기", count: 1 },
  { person: "deuk", date: "2026-08-21", name: "헬스보이", count: 1 },
  { person: "deuk", date: "2026-08-24", name: "데상트 동기", count: 1 },
  { person: "deuk", date: "2026-08-27", name: "임교수님", count: 1 },
  { person: "deuk", date: "2026-08-28", name: "동업계모임", count: 1 },
  { person: "deuk", date: "2026-09-03", name: "풋사과 05~08", count: 1 },
  { person: "deuk", date: "2026-09-04", name: "동국홍보대사 91", count: 1 },

  // 뿡
  { person: "bbung", date: "2026-08-15", name: "상빈,지예", count: 2 },
  { person: "bbung", date: "2026-08-17", name: "다운,채원", count: 2 },
  { person: "bbung", date: "2026-08-21", name: "여진,연수,우경,민정", count: 4 },
  { person: "bbung", date: "2026-09-04", name: "선주,수진,주비", count: 3 },
  { person: "bbung", date: "2026-09-06", name: "성재,욱환,정민,진호,주환", count: 5 },
  { person: "bbung", date: "2026-09-13", name: "수완,지선,수진,세진,주희", count: 5 },
];

let data = {};
let seeded = false;

// 실시간 구독
meetingsRef.on("value", (snapshot) => {
  const val = snapshot.val();

  if (!val && !seeded) {
    seeded = true;
    const seedObj = {};
    initialData.forEach(item => {
      const key = meetingsRef.push().key;
      seedObj[key] = { ...item, done: false };
    });
    meetingsRef.set(seedObj);
    return;
  }

  data = val || {};
  document.getElementById("syncStatus").textContent = "실시간 동기화 연결됨";
  render();
}, (error) => {
  document.getElementById("syncStatus").textContent = "동기화 연결 실패: " + error.message;
});

function formatDateLabel(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
}

function calcDday(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  const diffMs = target - today;
  const diffDays = Math.round(diffMs / 86400000);
  if(diffDays === 0) return { label: "D-DAY", cls: "today" };
  if(diffDays > 0) return { label: "D-" + diffDays, cls: "" };
  return { label: "D+" + Math.abs(diffDays), cls: "past" };
}

function updateDate(id, value){
  if(!value) return;
  meetingsRef.child(id).update({ date: value });
}

function updateName(id, value){
  const v = value.trim();
  if(!v){ alert("모임명을 입력해 주세요."); render(); return; }
  meetingsRef.child(id).update({ name: v });
}

function updateCount(id, value){
  let v = parseInt(value, 10);
  if(isNaN(v) || v < 1) v = 1;
  meetingsRef.child(id).update({ count: v });
  return v;
}

function updateCost(id, value){
  let v = parseInt(value, 10);
  if(isNaN(v) || v < 0) v = 0;
  meetingsRef.child(id).update({ cost: v });
  return v;
}

function formatWon(value){
  return (Number(value) || 0).toLocaleString("ko-KR") + "원";
}

function toggleDone(id, checked){
  meetingsRef.child(id).update({ done: checked });
}

function deleteRow(id){
  meetingsRef.child(id).remove();
}

function addRow(person){
  const dateInput = document.getElementById(person + "-date");
  const nameInput = document.getElementById(person + "-name");
  const countInput = document.getElementById(person + "-count");
  const costInput = document.getElementById(person + "-cost");

  const dateVal = dateInput.value;
  const nameVal = nameInput.value.trim();
  let countVal = parseInt(countInput.value, 10);
  let costVal = parseInt(costInput.value, 10);

  if(isNaN(countVal) || countVal < 1) countVal = 1;
  if(isNaN(costVal) || costVal < 0) costVal = 0;

  if(!dateVal || !nameVal){
    alert("날짜와 모임명을 입력해 주세요.");
    return;
  }

  meetingsRef.push().set({
    person: person,
    date: dateVal,
    name: nameVal,
    count: countVal,
    cost: costVal,
    done: false
  });

  dateInput.value = "";
  nameInput.value = "";
  countInput.value = "1";
  costInput.value = "";
}


function openDatePicker(id, currentDate){
  const picker = document.getElementById("global-date-picker");
  picker.dataset.meetingId = id;
  picker.value = currentDate || "";
  picker.focus();

  // Native mobile/desktop calendar picker.
  if(typeof picker.showPicker === "function"){
    try {
      picker.showPicker();
      return;
    } catch(e) {}
  }

  picker.click();
}

function applyPickedDate(value){
  const picker = document.getElementById("global-date-picker");
  const id = picker.dataset.meetingId;

  if(!id || !value) return;

  meetingsRef.child(id).update({ date: value });
  picker.blur();
}

function switchTab(person){
  currentTab = person;
  localStorage.setItem("chungmo-current-tab", person);

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.person === person);
  });

  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(){
  const todayLabel = document.getElementById("todayLabel");
  const today = new Date();
  todayLabel.textContent = `오늘: ${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()} 기준`;

  renderStats();

  const panel = document.getElementById("schedule-panel");
  const person = currentTab;
  const isDeuk = person === "deuk";
  const label = isDeuk ? "득" : "뿡";
  const headerClass = isDeuk ? "deuk-header" : "bbung-header";
  const buttonClass = isDeuk ? "deuk-btn" : "bbung-btn";

  const rows = Object.entries(data)
    .map(([id, item]) => ({ id, ...item }))
    .filter(d => d.person === person)
    .sort((a, b) => a.date.localeCompare(b.date));

  const totalPeople = rows.reduce((sum, item) => sum + (Number(item.count) || 0), 0);
  const totalCost = rows.reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
  const summary = `총 ${rows.length}건 · ${totalPeople}명 · ${formatWon(totalCost)}`;

  const tableRows = rows.map(item => {
    const dday = calcDday(item.date);
    const count = Math.max(1, Number(item.count) || 1);
    const cost = Math.max(0, Number(item.cost) || 0);
    const perPerson = Math.round(cost / count);

    return `
      <tr class="${item.done ? "done" : ""}">
        <td class="check-cell"><input type="checkbox" ${item.done ? "checked" : ""}
          onchange="toggleDone('${item.id}', this.checked)"></td>
        <td class="date-cell">
          <button type="button" class="date-button"
            onclick="openDatePicker('${item.id}', '${item.date}')"
            aria-label="날짜 ${formatDateLabel(item.date)} 수정">${formatDateLabel(item.date)}</button>
        </td>
        <td class="name-cell"><input type="text" class="edit-name" value="${escapeAttr(item.name)}" onchange="updateName('${item.id}', this.value)" aria-label="모임명 수정"></td>
        <td><input type="number" min="1" class="count-input" value="${count}"
          onchange="updateCount('${item.id}', this.value)"></td>
        <td class="cost-total"><input type="number" min="0" step="1000" class="cost-input"
          value="${cost}" onchange="updateCost('${item.id}', this.value)"></td>
        <td class="cost-per-person">${formatWon(perPerson)}</td>
        <td><span class="dday-badge ${dday.cls}">${dday.label}</span></td>
        <td class="del-cell"><button class="del-btn" title="삭제"
          onclick="deleteRow('${item.id}')">✕</button></td>
      </tr>`;
  }).join("");

  panel.innerHTML = `
    <div class="person-card">
      <div class="person-header ${headerClass}">
        <span>${label}</span>
        <span class="count-summary">${summary}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="check-cell"></th>
            <th>날짜</th><th>모임명</th><th>인원</th>
            <th>총 비용</th><th>1인 비용</th><th>D-day</th>
            <th class="del-cell"></th>
          </tr></thead>
          <tbody>${tableRows || '<tr><td colspan="8" class="empty">일정 없음</td></tr>'}</tbody>
        </table>
      </div>
      <div class="add-row">
        <input type="date" id="${person}-date">
        <input type="text" id="${person}-name" placeholder="모임명">
        <input type="number" id="${person}-count" min="1" value="1">
        <input type="number" id="${person}-cost" min="0" step="1000" placeholder="총 비용">
        <button class="add-btn ${buttonClass}" onclick="addRow('${person}')">+ 모임 추가</button>
      </div>
    </div>`;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.person === currentTab);
  });

  document.querySelectorAll(".edit-name").forEach(autoResizeName);
}

function renderStats(){
  const current = Object.values(data).filter(item => item.person === currentTab);
  const totalCount = current.length;
  const totalPeople = current.reduce((sum, item) => sum + (Number(item.count) || 0), 0);
  const totalCost = current.reduce((sum, item) => sum + (Number(item.cost) || 0), 0);

  document.getElementById("stat-total").textContent = `${totalCount}건`;
  document.getElementById("stat-people").textContent = `${totalPeople}명`;
  document.getElementById("stat-cost").textContent = formatWon(totalCost);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// render()는 Firebase의 실시간 리스너(meetingsRef.on("value", ...))가 호출합니다.
